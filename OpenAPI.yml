                              enum: [Low, Medium, High]
                            createdAt:
                              type: string
                              format: date-time

  /admin/reports/{reportId}/process:
    patch:
      tags: [Admin]
      summary: "[Admin] Process violation report"
      security:
        - BearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, action]
              properties:
                status:
                  type: string
                  enum: [Resolved, Dismissed]
                action:
                  type: string
                  enum: [DeletePost, WarnUser, BanUser, NoAction]
                  description: "Administrative action taken"
                note:
                  type: string
                  example: "Post deleted and warning sent to user"
      responses:
        "200":
          description: Report processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

