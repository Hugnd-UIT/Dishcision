          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
            example: "BAN_USER"
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
