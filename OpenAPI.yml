openapi: 3.0.3
info:
  title: Dishcision API
  description: None
  version: 1.0.0

servers:
  - url: https://api.dishcision.com/api/v1
    description: Production enviroment

  - url: http://localhost:3000/api/v1
    description: Development enviroment

tags:
  - name: Auth
    description: AuthZ & AuthN
  - name: Users
    description: Users profile
  - name: Preferences
    description: User preferences
  - name: Posts
    description: Posts
  - name: Interactions
    description: Like, comment, share
  - name: Reviews
    description: User reviews
  - name: Decisions
    description: User decisions
  - name: AI
    description: AI decisions
  - name: Social
    description: Follow posts, save posts, messages
  - name: Search
    description: Search & Explore
  - name: Notifications
    description: Notifications
  - name: Reports
    description: Reports
  - name: Admin
    description: Admin only

# SECURITY

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Successful"
        data:
          type: object

    PaginatedMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "An error occurred"
        error:
          type: string

    # ── User ──────────────────────────────
    UserPublic:
      type: object
      properties:
        userId:
          type: integer
          example: 1
        username:
          type: string
          example: "nguyen-van-a"
        fullName:
          type: string
          example: "Nguyen Van A"
        avatarUrl:
          type: string
          format: uri
          example: "https://cdn.dishcision.com/avatars/1.jpg"
        bio:
          type: string
          example: "Passionate about Vietnamese cuisine 🍜"
        followersCount:
          type: integer
          example: 1200
        followingCount:
          type: integer
          example: 340
        role:
          type: string
          enum: [User, RestaurantAccount, Admin]
          example: "User"

    UserPrivate:
      allOf:
        - $ref: "#/components/schemas/UserPublic"
        - type: object
          properties:
            email:
              type: string
              format: email
              example: "nguyen@example.com"
            gender:
              type: string
              enum: [Male, Female, Other]
            dateOfBirth:
              type: string
              format: date
              example: "2000-05-15"
            accountStatus:
              type: string
              enum: [Active, Banned, Suspended]
            createdAt:
              type: string
              format: date-time

    # ── Auth ──────────────────────────────
    RegisterRequest:
      type: object
      required: [username, email, password, fullName]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: "nguyen-van-a"
        email:
          type: string
          format: email
          example: "nguyen@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "Passw0rd!23"
        fullName:
          type: string
          example: "Nguyen Van A"

    LoginRequest:
      type: object
      required: [credential, password]
      properties:
        credential:
          type: string
          description: "Email or username"
          example: "nguyen@example.com"
        password:
          type: string
          format: password
          example: "Passw0rd!23"

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
        expiresIn:
          type: integer
          description: "Access token expiration time (seconds)"
          example: 3600
        user:
          $ref: "#/components/schemas/UserPublic"

    # ── Preference ────────────────────────
    FoodPreference:
      type: object
      properties:
        preferenceId:
          type: integer
          example: 1
        name:
          type: string
          example: "Spicy food"
        description:
          type: string
          example: "Dishes with hot and spicy flavor"
        icon:
          type: string
          example: "🌶️"

    # ── Post ──────────────────────────────
    PostImage:
      type: object
      properties:
        imageId:
          type: integer
        imageUrl:
          type: string
          format: uri
          example: "https://cdn.dishcision.com/posts/img1.jpg"
        displayOrder:
          type: integer
          example: 1

    Post:
      type: object
      properties:
        postId:
          type: integer
          example: 42
        author:
          $ref: "#/components/schemas/UserPublic"
        content:
          type: string
          example: "Hanoi beef pho this morning was delicious! 🍜"
        images:
          type: array
          items:
            $ref: "#/components/schemas/PostImage"
        locationUrl:
          type: string
          format: uri
          example: "https://maps.google.com/?q=Pho+Thin+Ha+Noi"
        voucherCode:
          type: string
          example: "DISH20"
        hashtags:
          type: array
          items:
            type: string
          example: ["#pho", "#hanoi", "#breakfast"]
        likesCount:
          type: integer
          example: 235
        commentsCount:
          type: integer
          example: 18
        sharesCount:
          type: integer
          example: 7
        isLiked:
          type: boolean
          example: false
        isSaved:
          type: boolean
          example: false
        isPinned:
          type: boolean
          example: false
        status:
          type: string
          enum: [Active, Hidden, Deleted]
          example: "Active"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePostRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 2000
          example: "Hanoi beef pho this morning was delicious! 🍜"
        images:
          type: array
          items:
            type: object
            properties:
              imageUrl:
                type: string
                format: uri
              displayOrder:
                type: integer
        locationUrl:
          type: string
          format: uri
        voucherCode:
          type: string
        hashtags:
          type: array
          items:
            type: string

    # ── Comment ──────────────────────────
    Comment:
      type: object
      properties:
        commentId:
          type: integer
          example: 10
        author:
          $ref: "#/components/schemas/UserPublic"
        content:
          type: string
          example: "Looks so delicious, can you share the address?"
        parentCommentId:
          type: integer
          nullable: true
          example: null
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        likesCount:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time

    # ── Review ──────────────────────────
    Review:
      type: object
      properties:
        reviewId:
          type: integer
        author:
          $ref: "#/components/schemas/UserPublic"
        restaurantName:
          type: string
          example: "Pho Thin Lo Duc"
        locationUrl:
          type: string
          format: uri
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        content:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/PostImage"
        tags:
          type: array
          items:
            type: string
          example: ["Delicious", "Clean", "Authentic"]
        createdAt:
          type: string
          format: date-time

    # ── Food Decision ────────────────────
    FoodCategory:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
          example: "Noodle and soup dishes"
        icon:
          type: string
          example: "🍜"

    RandomWheelRequest:
      type: object
      properties:
        budget:
          type: integer
          description: "Maximum budget (VND)"
          example: 80000
        distance:
          type: number
          description: "Search radius (km)"
          example: 2.5
        preferenceIds:
          type: array
          items:
            type: integer
          example: [1, 3]
        latitude:
          type: number
          example: 21.0278
        longitude:
          type: number
          example: 105.8342

    RandomWheelResult:
      type: object
      properties:
        dishName:
          type: string
          example: "Hue Beef Noodle Soup"
        restaurant:
          type: object
          properties:
            name:
              type: string
              example: "Bun Bo Me Thao"
            address:
              type: string
              example: "15 Hang Bong, Hoan Kiem, Hanoi"
            mapsUrl:
              type: string
              format: uri
              example: "https://maps.google.com/?q=Bun+Bo+Me+Thao"
            estimatedPrice:
              type: integer
              example: 55000
            rating:
              type: number
              example: 4.7

    # ── AI ───────────────────────────────
    AIFoodDecideRequest:
      type: object
      properties:
        mood:
          type: string
          example: "feeling sad"
        budget:
          type: string
          example: "50k-100k"
        companions:
          type: integer
          description: "Number of dining companions"
          example: 2
        craving:
          type: string
          example: "warm soup, rich broth"
        preferenceIds:
          type: array
          items:
            type: integer
          example: [1, 4]

    AIFoodDecideResponse:
      type: object
      properties:
        requestId:
          type: integer
          example: 88
        suggestions:
          type: array
          items:
            type: object
            properties:
              rank:
                type: integer
              dishName:
                type: string
                example: "Hue Beef Noodle Soup"
              reason:
                type: string
                example: "Perfect for comforting soup cravings with a bold flavor"
              estimatedPrice:
                type: string
                example: "50,000 - 80,000 VND"
        modelUsed:
          type: string
          example: "gemini-2.0-flash"

    # ── Notification ─────────────────────
    Notification:
      type: object
      properties:
        notificationId:
          type: integer
        type:
          type: string
          enum: [Like, Comment, Share, Follow, System]
        message:
          type: string
          example: "foodie_tran liked your post"
        isRead:
          type: boolean
        relatedPostId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Report ──────────────────────────
    ReportRequest:
      type: object
      required: [reason]
      properties:
        postId:
          type: integer
          nullable: true
          description: "Reported post ID (if any)"
        reportedUserId:
          type: integer
          nullable: true
          description: "Reported user ID (if any)"
        reason:
          type: string
          enum: [Spam, Nudity, Violence, FakeNews, Harassment, Other]
          example: "Spam"
        description:
          type: string
          example: "This post repeatedly displays spam advertisements"

    # ── Message ──────────────────────────
    Message:
      type: object
      properties:
        messageId:
          type: integer
        sender:
          $ref: "#/components/schemas/UserPublic"
        content:
          type: string
          example: "The restaurant you recommended was truly great!"
        mediaUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── AuditLog ─────────────────────────
    AuditLog:
      type: object
      properties:
        logId:
          type: integer
        admin:
          $ref: "#/components/schemas/UserPublic"
        action:
          type: string
          example: "BAN_USER"
        targetType:
          type: string
          enum: [User, Post, Comment, Report, AIConfig]
        targetId:
          type: integer
        ipAddress:
          type: string
          example: "118.71.32.10"
        details:
          type: string
          example: "Banned user ID 55 due to spam advertising"
        createdAt:
          type: string
          format: date-time

# ─────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────
paths:
  # ════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenResponse"
        "409":
          description: Email or username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Forgot password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "nguyen@example.com"
      responses:
        "200":
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tokenHash, newPassword]
              properties:
                tokenHash:
                  type: string
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════
  # USERS
  # ════════════════════════════════════════
  /users/me:
    get:
      tags: [Users]
      summary: Get user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPrivate"
    put:
      tags: [Users]
      summary: Update user profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                bio:
                  type: string
                  maxLength: 255
                gender:
                  type: string
                  enum: [Male, Female, Other]
                dateOfBirth:
                  type: string
                  format: date
                avatarUrl:
                  type: string
                  format: uri
      responses:
        "200":
          description: Update successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPrivate"

  /users/{userId}:
    get:
      tags: [Users]
      summary: View another user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPublic"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/saved-posts:
    get:
      tags: [Social]
      summary: Get saved posts list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Post"
                      pagination:
                        $ref: "#/components/schemas/PaginatedMeta"

  /users/{userId}/follow:
    post:
      tags: [Social]
      summary: Follow user or restaurant
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Follow successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "409":
          description: Already following
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Social]
      summary: Unfollow user or restaurant
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unfollow successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users/{userId}/posts:
    get:
      tags: [Posts]
      summary: Get posts by user ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Post"
                      pagination:
                        $ref: "#/components/schemas/PaginatedMeta"

  # ════════════════════════════════════════
  # PREFERENCES
  # ════════════════════════════════════════
  /preferences:
    get:
      tags: [Preferences]
      summary: List system food preferences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/FoodPreference"

  /users/me/preferences:
    get:
      tags: [Preferences]
      summary: Get current user food preferences
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/FoodPreference"
    put:
      tags: [Preferences]
      summary: Update user food preferences
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferenceIds]
              properties:
                preferenceIds:
                  type: array
                  items:
                    type: integer
                  example: [1, 3, 5]
      responses:
        "200":
          description: Update successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ════════════════════════════════════════
  # POSTS
  # ════════════════════════════════════════
  /posts:
    get:
      tags: [Posts]
      summary: Get culinary post newsfeed
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, trending, following]
            default: latest
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Post"
                      pagination:
                        $ref: "#/components/schemas/PaginatedMeta"
    post:
      tags: [Posts]
      summary: Create new culinary post
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Post"

  /posts/upload-media:
    post:
      tags: [Posts]
      summary: Upload media to cloud storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload successful, returns URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url:
                            type: string
                            format: uri
                            example: "https://cdn.dishcision.com/posts/abc123.jpg"

  /posts/{postId}:
    get:
      tags: [Posts]
      summary: View post details
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Posts]
      summary: Edit post (author only)
      security:
